<!DOCTYPE html>

<html>

<head>

    <title>Shipping List</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Shipping List</h1>


<button onclick="goHome()">
    Back
</button>


<br><br>


<select id="shippingSet">

    <option>
        Select Set
    </option>

</select>


<select id="shippingReceive">

    <option value="All">
        All
    </option>

    <option value="Delivery">
        Delivery
    </option>

    <option value="Pick Up">
        Pick Up
    </option>

</select>


<button onclick="loadShipping()">
    Generate
</button>


<br><br>


<textarea
    id="shippingText"
    rows="30"
    cols="80"
    readonly>
</textarea>


<br><br>


<button onclick="copyShipping()">
    Copy
</button>


<button onclick="printShipping()">
    Print
</button>


<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/shipping.js"></script>

<script>
    loadSets("shippingSet");
</script>


</body>

</html>
